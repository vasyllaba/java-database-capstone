<!-- adminDashboard.html -->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" th:href="@{/assets/images/logo/logo.png}" />
    
    <!-- CSS Links -->
    <link rel="stylesheet" th:href="@{/assets/css/adminDashboard.css}">
    <link rel="stylesheet" th:href="@{/assets/css/style.css}">
    
    <!-- Utility & Rendering JS -->
    <script th:src="@{/js/render.js}" defer></script>
    <script th:src="@{/js/util.js}" defer></script>
    
    <!-- Component JS -->
    <script th:src="@{/js/components/header.js}" defer></script>
    <script th:src="@{/js/components/footer.js}" defer></script>
</head>
<body onload="renderContent()">
    <div class="container">
        <div class="wrapper">
            <!-- Header Placeholder -->
            <div id="header"></div>
            
            <!-- Main Dashboard Content -->
            <main class="main-content">
                <input type="text" id="searchBar" placeholder="search by doctor name" />
                
                <div class="filters">
                    <!-- Time Filter -->
                    <select id="timeFilter">
                        <option value="">Sort by time</option>
                        <option value="AM">AM</option>
                        <option value="PM">PM</option>
                    </select>
                    
                    <!-- Specialty Filter -->
                    <select id="specialtyFilter">
                        <option value="">Filter by specialty</option>
                        <option value="Cardiologist">Cardiologist</option>
                        <option value="Dentist">Dentist</option>
                        <option value="Neurologist">Neurologist</option>
                        <option value="Orthopedics">Orthopedics</option>
                        <option value="General">General</option>
                    </select>
                </div>
                
                <!-- Dynamic Content Display Area -->
                <div id="content"></div>
            </main>
            
            <!-- Footer Placeholder -->
            <div id="footer"></div>
        </div>
    </div>

    <!-- Hidden Modal for Adding Doctors -->
    <div id="modal" class="modal">
        <span id="closeModal" class="close">&times;</span>
        <div id="modal-body"></div>
    </div>

    <!-- Page Specific Logic (Service Components) -->
    <!-- Note: Using Thymeleaf th:src as it is standard for Spring Boot -->
    <script type="module" th:src="@{/js/components/modals.js}" defer></script>
    <script type="module" th:src="@{/js/adminDashboard.js}" defer></script>
    <script type="module" th:src="@{/js/components/doctorCard.js}" defer></script>
</body>
</html>
