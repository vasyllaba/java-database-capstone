<!-- doctorDashboard.html -->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Doctor Dashboard</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" th:href="@{/assets/images/logo/logo.png}" />
    
    <!-- CSS Links -->
    <link rel="stylesheet" th:href="@{/assets/css/adminDashboard.css}">
    <link rel="stylesheet" th:href="@{/assets/css/doctorDashboard.css}">
    <link rel="stylesheet" th:href="@{/assets/css/style.css}">
    
    <!-- Utility & Rendering JS -->
    <script th:src="@{/js/render.js}" defer></script>
    <script th:src="@{/js/util.js}" defer></script>
    
    <!-- Component JS -->
    <script th:src="@{/js/components/header.js}" defer></script>
    <script th:src="@{/js/components/footer.js}" defer></script>
    <script th:src="@{/js/components/patientRows.js}" defer></script>
    
    <!-- Page Specific Logic (Service Components) -->
    <script type="module" th:src="@{/js/services/patientServices.js}" defer></script>
    <script type="module" th:src="@{/js/doctorDashboard.js}" defer></script>
</head>
<body onload="renderContent()">
    <div class="container">
        <div class="wrapper">
            <!-- Header Placeholder -->
            <div id="header"></div>
            
            <!-- Main Dashboard Content -->
            <div class="main-content">
                
                <!-- Search Bar -->
                <input type="text" id="searchBar" class="searchBar" placeholder="Search Bar for custom output" />
                
                <!-- Filter Controls -->
                <!-- Filter Controls -->
                <div class="filters">
                    <button id="todayButton" class="today-btn">Today's Appointments</button>
                    <input type="date" id="datePicker" class="date-picker" />
                </div>
                
                <!-- Patient Records Table -->
                <table id="patientTable" style="width: 100%; border-collapse: collapse; margin-top: 20px;">
                    <thead>
                        <tr style="background-color: #015c5d; color: white; text-align: left;">
                            <th style="padding: 12px; border: 1px solid #ccc;">Patient ID</th>
                            <th style="padding: 12px; border: 1px solid #ccc;">Name</th>
                            <th style="padding: 12px; border: 1px solid #ccc;">Phone No.</th>
                            <th style="padding: 12px; border: 1px solid #ccc;">Email</th>
                            <th style="padding: 12px; border: 1px solid #ccc;">Prescription</th>
                        </tr>
                    </thead>
                    <tbody id="patientTableBody">
                        <!-- Dynamic content will be injected here via JS -->
                    </tbody>
                </table>
            </div>
            
            <!-- Footer Placeholder -->
            <div id="footer"></div>
        </div>
    </div>
</body>
</html>
