<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Select Role</title>
    <link rel="icon" type="image/png" href="./assets/images/logo/logo.png" />
    
    <!-- CSS Links -->
    <link rel="stylesheet" href="./assets/css/index.css">
    <link rel="stylesheet" href="./assets/css/style.css">
    
    <!-- Utility & Rendering JS -->
    <script src="./js/util.js" defer></script>
    <script src="./js/render.js" defer></script>
    
    <!-- Component JS -->
    <script src="./js/components/header.js" defer></script>
    <script src="./js/components/footer.js" defer></script>
</head>
<body>
    <div class="container">
        <div class="wrapper">
            <!-- Header Placeholder -->
            <div id="header"></div>

            <!-- Main Content -->
            <main class="main-content">
                <h2>Select Your Role</h2>
                
                <div class="role-buttons">
                    <button id="adminBtn" type="button">Admin</button>
                    <button id="doctorBtn" type="button">Doctor</button>
                    <button id="patientBtn" type="button">Patient</button>
                </div>
            </main>

            <!-- Footer Placeholder -->
            <div id="footer"></div>
        </div>
    </div>

    <!-- Hidden Modal -->
    <div id="modal" class="modal" style="display: none;">
        <div class="modal-content">
            <span id="closeModal" class="close-btn">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <!-- Page Specific Logic (Service) -->
    <script type="module" src="./js/services/index.js" defer></script>
</body>
</html>
