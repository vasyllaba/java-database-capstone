name: Lint Frontend

on: [push, pull_request]

jobs: 
  lint-frontend: 
    runs-on: ubuntu-latest
    name: Lint HTML, CSS, and JS
    steps: 
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4 
        with: 
          node-version: '18'

      - name: Install linters
        run: |
          npm install --global htmlhint stylelint@15 stylelint-config-standard@34 eslint@8.57.1
          echo "NODE_PATH=$(npm root --global)" >> "$GITHUB_ENV"

      - name: Lint HTML
        run: htmlhint "app/src/main/resources/static/pages/**/*.html" "app/src/main/resources/templates/**/*.html" || true

      - name: Lint CSS
        run: stylelint "app/src/main/resources/static/assets/css/**/*.css" || true

      - name: Lint JS
        run: eslint "app/src/main/resources/static/js/**/*.js" || true
